<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<a href="{{ href }}" onMouseMove="{{ onMove }}" onMouseLeave="{{ onLeave }}" style="position:relative;display:flex;flex-direction:column;gap:16px;height:100%;padding:24px;border-radius:22px;background:#FFFFFF;border:1px solid rgba(25,44,88,0.08);box-shadow:0 1px 2px rgba(25,44,88,0.04);color:#192C58;overflow:hidden;transform:{{ tf }};transition:transform 420ms cubic-bezier(0.22,1,0.36,1),box-shadow 420ms cubic-bezier(0.22,1,0.36,1),border-color 300ms" style-hover="box-shadow:0 24px 48px -28px rgba(25,44,88,0.45);border-color:rgba(69,154,213,0.4);color:#192C58" style-focus="outline:3px solid #9CC8EC;outline-offset:2px">
  <span aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;opacity:{{ glowOp }};background:{{ glow }};transition:opacity 300ms"></span>
  <sc-if value="{{ preview }}" hint-placeholder-val="{{ true }}">
    <div style="position:relative;height:150px;margin:-24px -24px 4px;padding:16px 0 0 24px;overflow:hidden;background:radial-gradient(260px 140px at 30% 0%,rgba(69,154,213,0.18),transparent 70%),linear-gradient(160deg,#F4F8FD,#EEF4FC);border-bottom:1px solid rgba(25,44,88,0.06)">
      <div style="position:absolute;left:24px;right:-24px;top:18px;height:180px;transform:{{ mockTf }};transition:transform 520ms cubic-bezier(0.22,1,0.36,1)"><dc-import name="AppMock" kind="{{ kind }}" compact="{{ true }}" badge="" radius="14px 0 0 0" hint-size="100%,100%" style="width:100%;height:100%"></dc-import></div>
    </div>
  </sc-if>
  <div style="position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
    <span style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#274798,#459AD5);color:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,0.25)"><cs-icon name="{{ p.icon }}" size="22"></cs-icon></span>
    <sc-if value="{{ p.status }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:#FFF6E5;color:#8A5200;font:600 11px/1 Geist"><span style="width:6px;height:6px;border-radius:50%;background:#E0A030"></span>{{ p.status }} · {{ p.statusNote }}</span></sc-if>
  </div>
  <div style="position:relative;display:flex;flex-direction:column;gap:8px;flex:1">
    <span style="font:500 11px/1 'Geist Mono',monospace;letter-spacing:0.06em;text-transform:uppercase;color:#2F7FBC">{{ p.category }}</span>
    <span style="font:600 21px/1.2 Geist;letter-spacing:-0.02em">{{ p.name }}</span>
    <span style="font:400 14px/1.55 Geist;color:#4B5770;text-wrap:pretty">{{ p.desc }}</span>
  </div>
  <span style="position:relative;display:inline-flex;align-items:center;gap:6px;font:600 14px/1 Geist;color:#274798">Scopri il software<cs-icon name="arrow-right" size="15"></cs-icon></span>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:300},&quot;product&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{id:string;name:string;category:string;desc:string;icon:string;href:string;status?:string;statusNote?:string}&quot;}}">
class Component extends DCLogic {
  state = { x: 50, y: 50, h: false };
  renderVals() {
    const p = this.props.product || {};
    const s = this.state;
    const reduce = window.CS && window.CS.reduceMotion;
    return {
      p, href: p.href || '#',
      preview: this.props.preview !== false,
      kind: ({ 'gest-park': 'park', 'gest-park-web': 'dash', 'gest-crash-carw': 'crash', 'gest-crash-cpew': 'sheet', 'gest-crash-cpa': 'crash', 'gest-rent': 'dash', 'gest': 'gest', 'eseboll': 'invoice', 'stiltocco': 'gest', 'videoperizia': 'video' })[p.id] || 'dash',
      mockTf: s.h && !reduce ? 'translateY(-6px)' : 'none',
      tf: s.h && !reduce ? 'translateY(-4px)' : 'none',
      glowOp: s.h ? 1 : 0,
      glow: 'radial-gradient(360px circle at ' + s.x + '% ' + s.y + '%, rgba(69,154,213,0.12), transparent 60%)',
      onMove: (e) => { const r = e.currentTarget.getBoundingClientRect(); this.setState({ h: true, x: ((e.clientX - r.left) / r.width) * 100, y: ((e.clientY - r.top) / r.height) * 100 }); },
      onLeave: () => this.setState({ h: false })
    };
  }
}
</script>
</body>
</html>
